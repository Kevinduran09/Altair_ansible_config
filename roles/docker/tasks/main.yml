---
- name: Validate supported Docker platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: Altair supports Ubuntu on amd64 or arm64.

- name: Install Docker repository dependencies
  ansible.builtin.apt:
    name: [ca-certificates, python3-debian, python3-requests]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove legacy hard-coded Focal repository
  ansible.builtin.apt_repository:
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    state: absent
    update_cache: false

- name: Configure signed Docker repository for the installed Ubuntu release
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: ["{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  register: docker_repository

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if docker_repository.changed else 3600 }}"

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
