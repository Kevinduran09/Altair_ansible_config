---
- name: Validate requested applications
  ansible.builtin.assert:
    that:
      - apps is mapping
      - apps_selected is sequence and apps_selected is not string
      - apps_selected | difference(apps.keys() | list) | length == 0
    fail_msg: Requested app is not defined in inventory/group_vars/all/apps.yml.

- name: Deploy selected applications in catalog order
  ansible.builtin.include_tasks: deploy.yml
  loop: "{{ apps | dict2items }}"
  loop_control:
    loop_var: application
    label: "{{ application.key }}"
  when:
    - apps_selected | length == 0 or application.key in apps_selected
    - application.value.enabled | default(true) | bool
