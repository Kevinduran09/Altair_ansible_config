---
- name: Create server directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  loop:
    - "{{ stacks_root }}"
    - "{{ infra_root }}"
    - "{{ apps_root }}"
    - "{{ tools_root }}"
    - "{{ data_services_root }}"
    - "{{ data_root }}"
    - "{{ db_data_root }}"
    - "{{ app_data_root }}"
    - "{{ shared_data_root }}"
    - "{{ personal_root }}"
    - "{{ backups_root }}"
    - "{{ scripts_root }}"
    - "{{ config_root }}"
    - "{{ config_root }}/apps"
    - "{{ logs_root }}"
