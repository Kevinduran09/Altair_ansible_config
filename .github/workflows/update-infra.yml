---
name: Update Infra Deploy
on:
  push:
    branches: [main]
    paths:
      - inventory/**
      - roles/**
      - playbooks/**
      - proxy_hosts/**
      - scripts/**
      - requirements.*
      - ansible.cfg
      - .github/**
  workflow_dispatch:
    inputs:
      scope:
        description: Configuration to reconcile
        type: choice
        default: apps
        options: [apps, infrastructure, backup, proxy-hosts, data-services, netdata, all]
      check:
        description: Preview changes without applying them
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  deploy:
    # Enable automatic reconciliation only after completing the migration checklist.
    if: github.event_name == 'workflow_dispatch' || vars.ALTAIR_AUTO_DEPLOY == 'true'
    uses: ./.github/workflows/ansible-deploy.yml
    with:
      scope: ${{ github.event_name == 'push' && 'all' || inputs.scope }}
      app: all
      check: ${{ github.event_name == 'workflow_dispatch' && inputs.check }}
    secrets: inherit
