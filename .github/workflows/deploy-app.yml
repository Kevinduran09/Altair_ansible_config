---
name: Deploy App
on:
  workflow_dispatch:
    inputs:
      app:
        description: Catalog key, comma-separated apps, all, or netdata
        required: true
        default: all
        type: string
      check:
        description: Preview changes without applying them
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  deploy:
    uses: ./.github/workflows/ansible-deploy.yml
    with:
      scope: apps
      app: ${{ inputs.app }}
      check: ${{ inputs.check }}
    secrets: inherit
